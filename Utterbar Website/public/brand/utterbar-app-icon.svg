<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" color-interpolation="linearRGB">
    <defs>
        <linearGradient id="ai-bg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#1e293b" />
            <stop offset="100%" stop-color="#090e17" />
        </linearGradient>
        <linearGradient id="ai-pill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#223042" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <linearGradient id="ai-wave" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#00f6ff" />
            <stop offset="25%"  stop-color="#00e2fb" />
            <stop offset="50%"  stop-color="#00ccf5" />
            <stop offset="75%"  stop-color="#00b5ed" />
            <stop offset="100%" stop-color="#00a3ff" />
        </linearGradient>
        <filter id="ai-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
        </filter>
    </defs>
    <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#ai-bg)" stroke="#334155" stroke-width="2" />
    <g transform="translate(32, 80) scale(1.6)" filter="url(#ai-shadow)">
        <rect x="0" y="0" width="120" height="60" rx="30" fill="url(#ai-pill)" stroke="#ffffff" stroke-width="2" />
        <circle cx="20" cy="30" r="8" fill="#ffffff" />
        <g fill="url(#ai-wave)">
            <rect x="44"  y="25" width="4" height="10" rx="2" />
            <rect x="54"  y="21" width="4" height="18" rx="2" />
            <rect x="64"  y="16" width="4" height="28" rx="2" />
            <path d="M 74 10 A 2 2 0 0 1 78 10 V 50 L 74 44 Z" />
            <rect x="84"  y="16" width="4" height="28" rx="2" />
            <rect x="94"  y="21" width="4" height="18" rx="2" />
            <rect x="104" y="25" width="4" height="10" rx="2" />
        </g>
    </g>
</svg>
