<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" color-interpolation="linearRGB">
    <defs>
        <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#0A0E17" />
            <stop offset="100%" stop-color="#10151F" />
        </linearGradient>
        <radialGradient id="og-glow" cx="85%" cy="15%" r="60%">
            <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.22" />
            <stop offset="60%"  stop-color="#22D3EE" stop-opacity="0.04" />
            <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="og-pill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#223042" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <linearGradient id="og-wave" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#00f6ff" />
            <stop offset="50%"  stop-color="#00ccf5" />
            <stop offset="100%" stop-color="#00a3ff" />
        </linearGradient>
        <linearGradient id="og-wmbar" gradientUnits="userSpaceOnUse" x1="546" y1="0" x2="790" y2="0">
            <stop offset="0%"   stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#00A3FF" />
        </linearGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#og-bg)" />
    <rect width="1200" height="630" fill="url(#og-glow)" />

    <!-- Big pill mark on the left -->
    <g transform="translate(100, 150) scale(2.5)">
        <rect x="0" y="0" width="120" height="60" rx="30" fill="url(#og-pill)" stroke="#ffffff" stroke-width="2" />
        <circle cx="20" cy="30" r="8" fill="#ffffff" />
        <g fill="url(#og-wave)">
            <rect x="44"  y="25" width="4" height="10" rx="2" />
            <rect x="54"  y="21" width="4" height="18" rx="2" />
            <rect x="64"  y="16" width="4" height="28" rx="2" />
            <path d="M 74 10 A 2 2 0 0 1 78 10 V 50 L 74 44 Z" />
            <rect x="84"  y="16" width="4" height="28" rx="2" />
            <rect x="94"  y="21" width="4" height="18" rx="2" />
            <rect x="104" y="25" width="4" height="10" rx="2" />
        </g>
    </g>

    <!-- Wordmark + tagline block -->
    <text x="100" y="440"
          font-family="Instrument Sans, sans-serif"
          font-size="112" font-weight="700" letter-spacing="-4"
          fill="#ffffff"><tspan fill="#ffffff">Utter</tspan><tspan fill="url(#og-wmbar)">bar</tspan></text>

    <text x="100" y="500"
          font-family="Instrument Sans, sans-serif"
          font-size="36" font-weight="300" letter-spacing="-1"
          fill="#8A8A94">Dictation that stays on your PC.</text>

    <!-- Three proof lines, monospaced eyebrow feel -->
    <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#22D3EE">
        <text x="100" y="560">LOCAL-ONLY  ·  NO ACCOUNT  ·  NO TELEMETRY</text>
    </g>

    <!-- Domain bottom-right -->
    <text x="1100" y="580"
          font-family="SF Mono, Menlo, Consolas, monospace"
          font-size="20" letter-spacing="2" fill="#8A8A94" text-anchor="end">utterbar.com</text>
</svg>
