<!--
  Utterbar pill mark — canonical geometry per DESIGN_SYSTEM.md §10.1.

  Direct port of resources/views/components/logo.blade.php in the marketing
  repo. The viewBox carries 2px padding on each side so the white stroke
  does not clip at the edges (pill is 120x60, box is 124x64).

  This SVG feeds the Tauri icon pipeline (scripts/generate-icon.py →
  `pnpm tauri icon`) so the installer, taskbar, and tray glyphs all match
  the in-app <UtterbarLogoMark /> and the marketing site pixel-for-pixel.
  Do NOT redraw. If a new size is needed, scale.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 124 64" color-interpolation="linearRGB">
    <defs>
        <linearGradient id="ub-mark-pill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#223042" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <linearGradient id="ub-mark-wave" x1="0%" y1="0%" x2="0%" y2="100%" color-interpolation="linearRGB">
            <stop offset="0%"   stop-color="#00f6ff" />
            <stop offset="25%"  stop-color="#00e2fb" />
            <stop offset="50%"  stop-color="#00ccf5" />
            <stop offset="75%"  stop-color="#00b5ed" />
            <stop offset="100%" stop-color="#00a3ff" />
        </linearGradient>
    </defs>

    <!-- Pill body + crisp 2px white stroke -->
    <rect x="0" y="0" width="120" height="60" rx="30"
          fill="url(#ub-mark-pill)"
          stroke="#ffffff" stroke-width="2" />

    <!-- White hole-punch on the left -->
    <circle cx="20" cy="30" r="8" fill="#ffffff" />

    <!-- Internal waveform with central speech-bubble tail (down-right) -->
    <g fill="url(#ub-mark-wave)">
        <rect x="44"  y="25" width="4" height="10" rx="2" />
        <rect x="54"  y="21" width="4" height="18" rx="2" />
        <rect x="64"  y="16" width="4" height="28" rx="2" />
        <path d="M 74 10 A 2 2 0 0 1 78 10 V 50 L 74 44 Z" />
        <rect x="84"  y="16" width="4" height="28" rx="2" />
        <rect x="94"  y="21" width="4" height="18" rx="2" />
        <rect x="104" y="25" width="4" height="10" rx="2" />
    </g>
</svg>
