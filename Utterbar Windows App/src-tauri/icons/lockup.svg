<!--
  Horizontal lockup (glyph + wordmark) — canonical form per
  DESIGN_SYSTEM.md §10.1.1 and mirrors resources/views/components/logo.blade.php
  in the marketing repo.

  Glyph:    the canonical pill mark on a 124×64 box (2px stroke padding).
  Wordmark: Instrument Sans, weight 600, tracking -0.04em, "Utter" in white
            and "bar" in the dedicated wordmark cyan gradient
            (#00e5ff → #00a3ff — this is SEPARATE from the --accent trio).
  Gap:      ~14px between glyph and wordmark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 64" color-interpolation="linearRGB">
    <defs>
        <linearGradient id="ub-lockup-pill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#223042" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <linearGradient id="ub-lockup-wave" x1="0%" y1="0%" x2="0%" y2="100%" color-interpolation="linearRGB">
            <stop offset="0%"   stop-color="#00f6ff" />
            <stop offset="25%"  stop-color="#00e2fb" />
            <stop offset="50%"  stop-color="#00ccf5" />
            <stop offset="75%"  stop-color="#00b5ed" />
            <stop offset="100%" stop-color="#00a3ff" />
        </linearGradient>
        <linearGradient id="ub-lockup-text" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#00e5ff" />
            <stop offset="100%" stop-color="#00a3ff" />
        </linearGradient>
    </defs>

    <!-- Glyph -->
    <g transform="translate(2, 2)">
        <rect x="0" y="0" width="120" height="60" rx="30"
              fill="url(#ub-lockup-pill)"
              stroke="#ffffff" stroke-width="2" />
        <circle cx="20" cy="30" r="8" fill="#ffffff" />
        <g fill="url(#ub-lockup-wave)">
            <rect x="44"  y="25" width="4" height="10" rx="2" />
            <rect x="54"  y="21" width="4" height="18" rx="2" />
            <rect x="64"  y="16" width="4" height="28" rx="2" />
            <path d="M 74 10 A 2 2 0 0 1 78 10 V 50 L 74 44 Z" />
            <rect x="84"  y="16" width="4" height="28" rx="2" />
            <rect x="94"  y="21" width="4" height="18" rx="2" />
            <rect x="104" y="25" width="4" height="10" rx="2" />
        </g>
    </g>

    <!-- Wordmark -->
    <text x="138" y="46"
          font-family="'Instrument Sans Variable', 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="56" font-weight="600" letter-spacing="-2.24">
        <tspan fill="#ffffff">Utter</tspan><tspan fill="url(#ub-lockup-text)">bar</tspan>
    </text>
</svg>
