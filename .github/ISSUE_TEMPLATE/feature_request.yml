name: Feature or translation request
description: Suggest an improvement or a correction to interface wording.
title: "[Request]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: For translations, include the language, screen and current wording.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Suggested wording or the workflow you would like.
    validations:
      required: true
