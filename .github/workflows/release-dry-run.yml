name: Release dry-run

# Builds the full installer (MSI + NSIS) without signing. Catches packaging regressions
# before we cut a real release. Runs on demand and on pushes to release branches.

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/*'

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build bundle (unsigned)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri:build --verbose

      - name: Inspect artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length
          $msi = Get-ChildItem -Recurse src-tauri/target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Recurse src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $msi) { Write-Error 'no MSI produced' }
          if (-not $nsis) { Write-Error 'no NSIS installer produced' }

      - uses: actions/upload-artifact@v4
        with:
          name: orliq-unsigned-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
